# Cấu hình cho Render.com: New → Blueprint → chọn repository này là tự tạo dịch vụ.
services:
  - type: web
    name: am-phu-online
    runtime: node
    plan: free
    buildCommand: node build.js
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
